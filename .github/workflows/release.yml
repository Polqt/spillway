name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release candidate tag to publish
        required: true
        type: string

env:
  GO_VERSION: '1.27.2'

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    # Release publication and provenance signing require write access only in this job.
    permissions:
      contents: write # Create the GitHub release and upload assets.
      packages: write # Publish the versioned container image to GHCR.
      id-token: write # Request the OIDC token used by provenance signing.
      attestations: write # Store build provenance attestations.
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manually requested release candidate tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install pinned dashboard dependencies
        run: make web-deps
      - name: Install Playwright browser dependencies on Linux
        run: make web-playwright-deps PLAYWRIGHT_INSTALL_ARGS=--with-deps

      - name: Run checks
        run: make check

      - name: Validate release configuration
        run: make release-check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish archives and versioned image
        run: go tool -modfile tools/release/go.mod goreleaser release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: '0'

      - name: Add stable image aliases
        if: ${{ !contains(env.RELEASE_TAG, '-rc.') }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          major="${version%%.*}"
          image=ghcr.io/polqt/spillway
          docker buildx imagetools create \
            --tag "$image:$major_minor" \
            --tag "$image:$major" \
            "$image:$version"

      - name: Attest release archives
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest container image
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: dist/digests.txt
