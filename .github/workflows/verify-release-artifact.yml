name: Verify release artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v1 stable or release-candidate tag to verify
        required: true
        type: string

jobs:
  verify-macos-artifact:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the requested release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v1\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          test "$GITHUB_REF" = refs/heads/main

      - name: Prepare artifact workspace
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/spillway-release-artifact"
          mkdir -p "$work/download" "$work/extracted" "$work/runtime"
          echo "WORK=$work" >> "$GITHUB_ENV"

      - name: Download all six release archives
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/download"
          echo 'Downloading all six release archives'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'spillway_*.tar.gz' --pattern 'spillway_*.zip' \
            --pattern checksums.txt --dir .

      - name: Verify all six archive checksums
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/download"
          awk 'NF == 2 && ($2 ~ /^spillway_.*_(darwin|linux)_(amd64|arm64)\.tar\.gz$/ || $2 ~ /^spillway_.*_windows_(amd64|arm64)\.zip$/) { print; count++ } END { if (count != 6) exit 1 }' \
            checksums.txt > release-archive-checksums.txt
          shasum -a 256 -c release-archive-checksums.txt
          echo 'All six archive checksums verified'

      - name: Verify provenance for all six archives
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/download"
          while read -r _ archive; do
            echo "Verifying provenance for $archive"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done < release-archive-checksums.txt
          echo 'All six archive attestations verified'

      - name: Resolve macOS architecture for native smoke test
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) goarch=arm64 ;;
            x86_64) goarch=amd64 ;;
            *) echo "Unsupported macOS runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "GOARCH=$goarch" >> "$GITHUB_ENV"

      - name: Run the downloaded macOS artifact
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/download"
          archive="spillway_${RELEASE_TAG#v}_darwin_${GOARCH}.tar.gz"
          tar -xzf "$archive" -C "$WORK/extracted" spillway
          binary="$WORK/extracted/spillway"
          version="$RELEASE_TAG"
          echo 'Checking downloaded binary version'
          version_output="$("$binary" version)"
          printf '%s\n' "$version_output"
          test "$version_output" = "$version"

          config="$WORK/runtime/config.yaml"
          echo 'Creating and validating an Ollama configuration'
          (cd "$WORK/runtime" && "$binary" init -yes -providers ollama -store -config "$config")
          "$binary" check -config "$config"
          local_key="$(sed -nE 's/^      key: "(sk-spillway-[A-Za-z0-9_-]+)"$/\1/p' "$config" | head -n 1)"
          test -n "$local_key"

          echo 'Starting downloaded macOS server'
          (cd "$WORK/runtime" && exec "$binary" serve -config "$config") > "$WORK/runtime/serve.log" 2>&1 &
          server_pid=$!
          stop_server() {
            kill -INT "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap stop_server EXIT

          for attempt in $(seq 1 30); do
            if grep -q 'msg=listening' "$WORK/runtime/serve.log"; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$WORK/runtime/serve.log"; exit 1; fi
            sleep 1
          done
          addr="$(sed -nE 's/.*msg=listening addr=([^ ]+).*/\1/p' "$WORK/runtime/serve.log" | tail -n 1)"
          test -n "$addr"
          echo "Checking health endpoint at $addr"
          curl --fail --silent --show-error "http://$addr/healthz"
          echo 'Checking authenticated model listing'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $local_key" \
            "http://$addr/v1/models" \
            | jq -e '.object == "list" and (.data | type == "array")' >/dev/null
          echo 'Stopping downloaded macOS server'
          kill -INT "$server_pid"
          wait "$server_pid"
          trap - EXIT
