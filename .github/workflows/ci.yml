name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', '1.27.2']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Run checks with race detector required
        run: make check RACE=-race

  vuln:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Scan dependencies
        run: make vuln

  release-dry-run:
    name: release artifacts and image smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Validate release configuration
        run: make release-check
      - name: Verify reproducible snapshot binaries
        shell: bash
        run: |
          set -euo pipefail
          make snapshot
          mkdir -p /tmp/spillway-snapshot-first
          cp dist/checksums.txt /tmp/spillway-snapshot-first/checksums.txt
          for archive in dist/*.tar.gz; do
            printf '%s ' "$(basename "$archive")"
            tar -xOf "$archive" spillway | sha256sum | cut -d ' ' -f 1
          done | sort > /tmp/spillway-snapshot-first/unix-binaries.sha256
          for archive in dist/*.zip; do
            printf '%s ' "$(basename "$archive")"
            unzip -p "$archive" spillway.exe | sha256sum | cut -d ' ' -f 1
          done | sort > /tmp/spillway-snapshot-first/windows-binaries.sha256
          make snapshot
          cmp /tmp/spillway-snapshot-first/checksums.txt dist/checksums.txt
          for archive in dist/*.tar.gz; do
            printf '%s ' "$(basename "$archive")"
            tar -xOf "$archive" spillway | sha256sum | cut -d ' ' -f 1
          done | sort > /tmp/spillway-snapshot-second-unix.sha256
          for archive in dist/*.zip; do
            printf '%s ' "$(basename "$archive")"
            unzip -p "$archive" spillway.exe | sha256sum | cut -d ' ' -f 1
          done | sort > /tmp/spillway-snapshot-second-windows.sha256
          cmp /tmp/spillway-snapshot-first/unix-binaries.sha256 /tmp/spillway-snapshot-second-unix.sha256
          cmp /tmp/spillway-snapshot-first/windows-binaries.sha256 /tmp/spillway-snapshot-second-windows.sha256
      - name: Build and smoke test Docker image
        shell: bash
        run: |
          set -euo pipefail
          image=spillway:ci
          name=spillway-ci
          volume=spillway-ci-data
          cleanup() {
            docker stop --time 10 "$name" >/dev/null 2>&1 || true
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            rm -rf .docker-context
          }
          trap cleanup EXIT
          make build
          mkdir -p .docker-context/linux/amd64 .docker-context/examples .docker-context/apps/spillway/volume
          cp bin/spillway .docker-context/linux/amd64/spillway
          cp examples/config.docker.yaml .docker-context/examples/config.docker.yaml
          cp apps/spillway/volume/.keep .docker-context/apps/spillway/volume/.keep
          docker build --platform linux/amd64 --file apps/spillway/Dockerfile --tag "$image" .docker-context
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '65532:65532'
          test "$(docker image inspect --format '{{.Size}}' "$image")" -lt 30000000
          if docker run --rm --entrypoint /bin/sh "$image" -c true 2>/dev/null; then
            echo 'distroless image unexpectedly contains /bin/sh'
            exit 1
          fi
          docker volume create "$volume"
          docker run --detach --name "$name" --read-only --tmpfs /tmp --publish 127.0.0.1:18080:8080 --volume "$GITHUB_WORKSPACE/.docker-context/examples/config.docker.yaml:/etc/spillway/config.yaml:ro" --volume "$volume:/var/lib/spillway" "$image"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/v1/chat/completions \
            --header 'Authorization: Bearer sk-test-spillway-docker' \
            --header 'Content-Type: application/json' \
            --data '{"model":"mock/echo","messages":[{"role":"user","content":"hello from CI"}]}' \
            | grep -q 'hello from CI'
          docker stop --time 10 spillway-ci
