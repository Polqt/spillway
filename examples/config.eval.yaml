# Evaluation-only server config using a local Ollama service. It keeps
# evaluation metadata out of a usage database by omitting store:.
server:
  listen: "127.0.0.1:8080"
  api_keys:
    - name: evaluation
      key: "sk-test-spillway-evaluation"
providers:
  ollama: {}
tiers:
  demo:
    models: [ollama/llama3.2:3b]
router:
  auto: [demo]
