# Ollama container config. Publish only to host loopback with -p 127.0.0.1:8080:8080.
# The container listens on 0.0.0.0, so the local key comes from SPILLWAY_LOCAL_KEY
# and the server refuses to start without it.
server:
  listen: "0.0.0.0:8080"
  api_keys:
    - name: demo
      key: "${SPILLWAY_LOCAL_KEY}"
providers:
  ollama: {}
tiers:
  demo:
    models: [ollama/llama3.2:3b]
router:
  auto: [demo]
store:
  path: /var/lib/spillway/spillway.db
  retention: 90d
